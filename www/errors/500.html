<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>500 Internal Server Error</title>
<style>
  :root {
    --bg: #14171c;
    --line: #2d333d;
    --text: #d9dee7;
    --dim: #8791a1;
    --err: #eb5757;
    --accent: #56b6c2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }
  main { width: 100%; max-width: 560px; }
  .code { font-size: 5rem; font-weight: 700; color: var(--err); line-height: 1; letter-spacing: -0.04em; }
  h1 { font-size: 1.4rem; margin: 12px 0 4px; }
  p { color: var(--dim); margin: 0 0 28px; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--line); }
  a:hover { border-color: var(--accent); }
  footer { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--dim); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <div class="code">500</div>
  <h1>Internal Server Error</h1>
  <p>The server encountered an error and could not complete your request.</p>
  <a href="/">&larr; Back to home</a>
  <footer>webserv</footer>
</main>
</body>
</html>
